<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flash Cards</title>
    <meta
      name="description"
      content="Flash Cards is a flashcard app for software engineering students to study HTML, CSS, JavaScript, coding concepts, and developer terminology."
    />
    <meta
      name="keywords"
      content="flashcards, coding flashcards, programming flashcards, software engineering, web development, HTML, CSS, JavaScript, frontend development, coding study app, developer study tool, learn to code, coding terms, programming concepts, syntax, coding practice"
    />
    <meta name="author" content="Paul Barrow-Wilkerson" />
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/css/index.css" />
    <script src="./assets/js/index.js" type="module"></script>
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a href="#home" class="header__link">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li><a class="nav__link" href="#home">My Decks</a></li>
          <li><a class="nav__link" href="#about">About</a></li>
        </ul>
      </nav>
    </header>
    <main class="page__main-content">
      <!-- Home Section -->
      <section id="home" class="gallery page__section">
        <h2 class="gallery__title">My Decks</h2>
        <div class="gallery__grid-wrapper">
          <ul class="gallery__list">
            <!-- This is where Decks Template Goes -->
          </ul>
          <button type="button" class="gallery__new-card-btn">
            + New Deck
          </button>
        </div>
      </section>

      <!-- New Deck View Section -->
      <section
        id="new-deck-view"
        class="new-deck-view page__section page__section_hidden"
      >
        <h2 class="new-deck-view__title">New Deck</h2>
        <form class="new-deck-view__form" id="new-deck-form">
          <fieldset class="new-deck-view__color-picker">
            <legend class="new-deck-view__legend">Pick the deck color</legend>
            <label class="new-deck-view__color-label" for="green">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_green"
                aria-label="Green"
                name="color"
                id="green"
                value="#64D583"
                type="radio"
                checked
              />
            </label>
            <label class="new-deck-view__color-label" for="blue">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_blue"
                aria-label="Blue"
                name="color"
                id="blue"
                value="#91A8F9"
                type="radio"
              />
            </label>
            <label class="new-deck-view__color-label" for="purple">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_purple"
                aria-label="Purple"
                name="color"
                id="purple"
                value="#AA8EF0"
                type="radio"
              />
            </label>
            <label class="new-deck-view__color-label" for="pink">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_pink"
                aria-label="Pink"
                name="color"
                id="pink"
                value="#EE92D7"
                type="radio"
              />
            </label>
            <label class="new-deck-view__color-label" for="orange">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_orange"
                aria-label="Orange"
                name="color"
                id="orange"
                value="#EE955E"
                type="radio"
              />
            </label>
            <label class="new-deck-view__color-label" for="yellow">
              <input
                class="new-deck-view__color-input new-deck-view__color-input_color_yellow"
                aria-label="Yellow"
                name="color"
                id="yellow"
                value="#F5D770"
                type="radio"
              />
            </label>
          </fieldset>
          <label class="new-deck-view__text-label" for="new-deck-text"
            >Write the JSON array of cards so that it matches this
            schema<textarea
              id="new-deck-text"
              name="new-deck-text"
              class="new-deck-view__text-input"
              placeholder="This is temporary placeholder text"
              required
            ></textarea>
          </label>
          <button type="submit" class="new-deck-view__submit-btn" disabled>
            Create the Deck
          </button>
        </form>
      </section>

      <!-- Deck View Section -->
      <section
        id="deck-view"
        class="gallery page__section page__section_hidden"
      >
        <div class="gallery__top-row">
          <h2 class="gallery__title"></h2>
          <button type="button" class="gallery__practice-btn">Practice</button>
        </div>
        <h3 class="gallery__error-text hidden">Could not fetch cards</h3>
        <div class="gallery__grid-wrapper">
          <ul class="gallery__list">
            <!-- This is where Flashcards Template Goes -->
          </ul>
          <button
            type="button"
            class="gallery__new-card-btn gallery__new-card-btn_location_deck-view"
          >
            + New Card
          </button>
        </div>
      </section>

      <!-- Carousel Section -->
      <section
        id="carousel"
        class="carousel page__section page__section_hidden"
      >
        <h2 class="carousel__title">HTML Tags Deck &middot; 1/10</h2>
        <div class="carousel__grid">
          <button
            class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
            type="button"
            aria-label="Previous Card"
          ></button>
          <div class="carousel__card carousel__card_color_green">
            <p class="carousel__card-text">&lt;body&gt;&lt;/body&gt;</p>
          </div>
          <button
            class="carousel__btn carousel__btn_type_right"
            type="button"
            aria-label="Next Card"
          ></button>
          <button
            class="carousel__btn carousel__btn_type_flip"
            type="button"
            aria-label="Flip Card"
          ></button>
        </div>
      </section>

      <!-- Not Found Section -->
      <section
        id="not-found"
        class="not-found page__section page__section_hidden"
      >
        <h2 class="not-found__status-code">404</h2>
        <p class="not-found__text">Sorry, nothing found!</p>
      </section>

      <!-- Deck Template -->
      <template id="deck-template">
        <li class="card card_color_green">
          <a href="#" class="card__link" aria-label="Open Deck"></a>
          <h3 class="card__title"></h3>
          <div class="card__row">
            <span class="card__count"></span>
            <button
              type="button"
              aria-label="Delete this deck"
              class="card__delete-btn"
            ></button>
          </div>
        </li>
      </template>

      <!-- Flashcard Template -->
      <template id="flashcard-template">
        <li class="card card_color_green">
          <h3 class="card__title"></h3>
          <div class="card__row">
            <button
              type="button"
              aria-label="Flip this Card"
              class="card__flip-btn"
            ></button>
            <button
              type="button"
              aria-label="Delete this deck"
              class="card__delete-btn"
            ></button>
          </div>
        </li>
      </template>

      <!-- Modal -->
      <div class="modal" id="modal">
        <div class="modal__container">
          <div class="modal__text-container">
            <h2 class="modal__title"></h2>
            <p class="modal__message"></p>
          </div>
          <div class="modal__buttons">
            <button type="button" class="modal__btn modal__btn_type_cancel">
              Cancel
            </button>
            <button type="button" class="modal__btn modal__btn_type_confirm">
              Confirm
            </button>
          </div>
        </div>
      </div>

    <!-- Footer -->
    <footer class="footer">
      <p class="footer__text">&copy; 2026 Paul Barrow-Wilkerson</p>
    </footer>
  </body>
</html>
